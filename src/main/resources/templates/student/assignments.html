<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bài tập của em')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container pb-5">

    <div class="hero mb-4 fade-up">
        <h3 class="fw-bold mb-1">Chào <span th:text="${currentUser.fullName}">bạn</span> 👋</h3>
        <p class="mb-3 opacity-75">Cùng hoàn thành bài tập hôm nay nhé!</p>
        <div class="d-flex justify-content-between small mb-1">
            <span>Tiến độ của bạn</span>
            <span class="fw-bold">
                <span th:text="${#sets.size(completedIds)}">0</span> /
                <span th:text="${#lists.size(assignments)}">0</span> bài
            </span>
        </div>
        <div class="progress">
            <div class="progress-bar"
                 th:style="'width:' + ${#lists.size(assignments) > 0 ? #sets.size(completedIds) * 100 / #lists.size(assignments) : 0} + '%'"></div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4 fade-up" th:each="a, st : ${assignments}">
            <div class="card card-lively card-hover h-100" th:classappend="'tone-' + ${st.index % 5}">
                <div class="position-relative">
                    <img th:if="${a.imagePath}" th:src="@{'/uploads/' + ${a.imagePath}}" class="thumb" alt="">
                    <div th:unless="${a.imagePath}" class="thumb-placeholder"
                         th:classappend="${completedIds.contains(a.id)} ? 'done' : (${a.deadline.isBefore(#temporals.createNow())} ? 'late' : '')">
                        <i class="bi bi-journal-richtext"></i>
                    </div>
                    <span th:if="${completedIds.contains(a.id)}"
                          class="badge text-bg-success position-absolute top-0 end-0 m-2 fs-6">
                        <i class="bi bi-check-circle-fill"></i> Đã hoàn thành
                    </span>
                    <span th:if="${!completedIds.contains(a.id) and a.deadline.isBefore(#temporals.createNow())}"
                          class="badge text-bg-danger position-absolute top-0 end-0 m-2 fs-6">
                        <i class="bi bi-alarm-fill"></i> Quá hạn
                    </span>
                    <span th:if="${!completedIds.contains(a.id) and !a.deadline.isBefore(#temporals.createNow())}"
                          class="badge text-bg-warning position-absolute top-0 end-0 m-2 fs-6">
                        <i class="bi bi-hourglass-split"></i> Chưa làm
                    </span>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="fw-bold" th:text="${a.title}">Tên bài tập</h5>
                    <p class="text-muted small flex-grow-1" th:if="${a.description}"
                       th:text="${#strings.abbreviate(a.description, 90)}">Mô tả</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-muted">
                            <i class="bi bi-clock"></i>
                            <span th:text="${#temporals.format(a.deadline, 'dd/MM/yyyy HH:mm')}">deadline</span>
                        </small>
                        <a th:href="@{/student/assignments/{id}(id=${a.id})}" class="btn btn-sm btn-cyan">
                            Xem bài <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}" class="card card-lively text-center p-5">
        <div class="display-4">🎉</div>
        <p class="text-muted mb-0">Chưa có bài tập nào, bạn nghỉ ngơi nhé!</p>
    </div>
</div>
</body>
</html>
