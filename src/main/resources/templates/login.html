<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<div class="login-bg p-3">
    <div class="card login-card p-4 p-md-5 fade-up">
        <div class="text-center mb-4">
            <span class="login-logo mb-3"><i class="bi bi-mortarboard-fill"></i></span>
            <h3 class="fw-bold mb-1">HỌC AI</h3>
            <p class="text-muted mb-0">Đăng nhập để bắt đầu học tập 🚀</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0 py-2" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="username">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control bg-light border-0" id="username" name="username"
                           th:value="${username}" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control bg-light border-0" id="password" name="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-rainbow w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </button>
        </form>

        <p class="text-muted small text-center mt-4 mb-0">
            Tài khoản mẫu: <code>teacher</code>, <code>hs1</code>, <code>hs2</code><br>
            Mật khẩu: <code>123456</code>
        </p>
    </div>
</div>
</body>
</html>
