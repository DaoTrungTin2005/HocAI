<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - HỌC AI'">HỌC AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark navbar-hocai mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2"
           th:href="${currentUser != null and currentUser.teacher} ? @{/teacher/assignments} : @{/student/assignments}">
            <i class="bi bi-mortarboard-fill fs-4"></i> HỌC AI
        </a>
        <div class="d-flex align-items-center text-white gap-3" th:if="${currentUser != null}">
            <div class="d-flex align-items-center gap-2">
                <span class="avatar" th:text="${#strings.substring(currentUser.fullName, 0, 1)}">A</span>
                <div class="lh-sm d-none d-sm-block">
                    <div class="fw-bold" th:text="${currentUser.fullName}">Tên</div>
                    <small th:text="${currentUser.teacher} ? 'Giáo viên' : 'Học sinh'">Vai trò</small>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-logout fw-semibold">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="messages">
    <div th:if="${success}" class="alert alert-success border-0 shadow-sm d-flex align-items-center gap-2 fade-up">
        <i class="bi bi-check-circle-fill fs-5"></i><span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm d-flex align-items-center gap-2 fade-up">
        <i class="bi bi-exclamation-triangle-fill fs-5"></i><span th:text="${error}"></span>
    </div>
</div>

</body>
</html>
